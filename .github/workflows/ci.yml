name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/batchgate-wheel
      - run: /tmp/batchgate-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/batchgate-wheel/bin/python -m unittest discover -s tests -v
      - run: /tmp/batchgate-wheel/bin/batchgate --version
      - run: /tmp/batchgate-wheel/bin/batchgate check examples/commerce.contract.json --data-dir examples/good --json-report reports/good.json --junit reports/good.xml --html-report reports/good.html
      - name: Broken batch must be rejected
        shell: bash
        run: |
          set +e
          /tmp/batchgate-wheel/bin/batchgate check examples/commerce.contract.json --data-dir examples/bad --json-report reports/bad.json --junit reports/bad.xml --html-report reports/bad.html
          result=$?
          set -e
          test "$result" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-and-demo-reports
          path: |
            dist/
            reports/
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Accept good batch through the composite action
        uses: ./
        with:
          contract: examples/commerce.contract.json
          data-directory: examples/good
          report-prefix: reports/action-good
      - name: Reject broken batch through the composite action
        id: broken
        continue-on-error: true
        uses: ./
        with:
          contract: examples/commerce.contract.json
          data-directory: examples/bad
          report-prefix: reports/action-bad
      - name: Verify rejection came from dataset checks
        env:
          ACTION_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          python - <<'PY'
          import json, os
          assert os.environ['ACTION_OUTCOME'] == 'failure'
          report = json.load(open('reports/action-bad.json'))
          assert report['passed'] is False
          assert sum(d['invalid_rows'] for d in report['datasets']) == 5
          PY
